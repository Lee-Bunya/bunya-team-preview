<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#F2F8F8"/><g font-family="Arial,sans-serif"><text x="60" y="65" font-size="17" letter-spacing="3" fill="#0A7D79">BUNYA INSIGHTS / PRACTICE CAPACITY</text><text x="60" y="128" font-size="39" font-weight="700" fill="#040F1D">Find the repeated work. Test the improvement.</text><rect x="60" y="185" width="1080" height="130" rx="5" fill="white" stroke="#D9E6E6"/><text x="85" y="223" fill="#0A7D79" font-size="16">A FRAGMENTED HANDOVER</text><text x="85" y="277" fill="#013B43" font-size="26">Search for context → Retype notes → Clarify owner → Chase progress</text><rect x="60" y="340" width="1080" height="130" rx="5" fill="#013B43"/><text x="85" y="378" fill="white" font-size="16">A WORKFLOW TO PILOT</text><text x="85" y="432" fill="white" font-size="26">Linked context → AI-assisted draft → Human review → Assigned action</text><text x="60" y="537" fill="#013B43" font-size="23" font-weight="700">Measure effort across the whole team, including checking and rework.</text><text x="60" y="589" fill="#013B43" font-size="16">Illustrative process. Time released is not a guaranteed saving or a substitute for staffing needs.</text></g></svg>