<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">CRM migration: records to working system</title><desc id="d">Inventory, map, rehearse, cut over, support.</desc><rect width="1200" height="630" fill="#F2F8F8"/><text x="60" y="76" fill="#0A7D79" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">BUNYA INSIGHTS / SYSTEMS &amp; OWNERSHIP</text><text x="60" y="147" fill="#040F1D" font-family="Arial,sans-serif" font-size="43" font-weight="bold">Move the records. Keep the context.</text><path d="M160 330H1040" stroke="#0A7D79" stroke-width="3"/><g transform="translate(60 235)"><rect width="200" height="228" rx="8" fill="white" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#0A7D79">01</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#013B43">INVENTORY</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="#040F1D">List records<tspan x="22" dy="29">and dependencies</tspan></text></g><g transform="translate(280 235)"><rect width="200" height="228" rx="8" fill="white" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#0A7D79">02</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#013B43">MAP</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="#040F1D">Match fields<tspan x="22" dy="29">and relationships</tspan></text></g><g transform="translate(500 235)"><rect width="200" height="228" rx="8" fill="#013B43" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#11B8B1">03</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="white">REHEARSE</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="white">Validate records<tspan x="22" dy="29">and workflows</tspan></text></g><g transform="translate(720 235)"><rect width="200" height="228" rx="8" fill="white" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#0A7D79">04</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#013B43">CUT OVER</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="#040F1D">Approve the<tspan x="22" dy="29">final transfer</tspan></text></g><g transform="translate(940 235)"><rect width="200" height="228" rx="8" fill="white" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#0A7D79">05</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#013B43">SUPPORT</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="#040F1D">Resolve issues<tspan x="22" dy="29">and test retrieval</tspan></text></g><text x="60" y="548" fill="#013B43" font-family="Arial,sans-serif" font-size="22">Check relationships, documents and tasks as well as record counts.</text></svg>