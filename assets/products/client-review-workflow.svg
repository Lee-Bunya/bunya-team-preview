<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#F2F8F8"/><g font-family="Arial,sans-serif"><text x="60" y="65" font-size="17" fill="#0A7D79" letter-spacing="3">BUNYA INSIGHTS / CLIENT REVIEWS</text><text x="60" y="128" font-size="40" fill="#040F1D" font-weight="700">A review is a workflow, not just a date.</text><rect x="60" y="215" width="240" height="160" rx="5" fill="white" stroke="#D9E6E6"/><text x="80" y="250" font-size="14" fill="#0A7D79">01 / TRIGGER</text><text x="80" y="295" font-size="25" font-weight="700" fill="#040F1D">Review due</text><text x="80" y="335" font-size="19" fill="#013B43">Check the date</text><path d="M306 290h28m-8-7 8 7-8 7" stroke="#0A7D79" stroke-width="2" fill="none"/><rect x="340" y="215" width="240" height="160" rx="5" fill="white" stroke="#D9E6E6"/><text x="360" y="250" font-size="14" fill="#0A7D79">02 / PREPARE</text><text x="360" y="295" font-size="25" font-weight="700" fill="#040F1D">Assign the work</text><text x="360" y="335" font-size="19" fill="#013B43">Confirm inputs</text><path d="M586 290h28m-8-7 8 7-8 7" stroke="#0A7D79" stroke-width="2" fill="none"/><rect x="620" y="215" width="240" height="160" rx="5" fill="white" stroke="#D9E6E6"/><text x="640" y="250" font-size="14" fill="#0A7D79">03 / MEET</text><text x="640" y="295" font-size="25" font-weight="700" fill="#040F1D">Hold the review</text><text x="640" y="335" font-size="19" fill="#013B43">Capture context</text><path d="M866 290h28m-8-7 8 7-8 7" stroke="#0A7D79" stroke-width="2" fill="none"/><rect x="900" y="215" width="240" height="160" rx="5" fill="#013B43" stroke="#D9E6E6"/><text x="920" y="250" font-size="14" fill="white">04 / FOLLOW UP</text><text x="920" y="295" font-size="25" font-weight="700" fill="white">Track actions</text><text x="920" y="335" font-size="19" fill="white">Name each owner</text><path d="M180 385v55h840v-55" stroke="#0A7D79" stroke-width="2" fill="none"/><rect x="305" y="415" width="590" height="75" rx="4" fill="#D9E6E6"/><text x="600" y="445" text-anchor="middle" font-size="19" font-weight="700" fill="#013B43">Exception? Keep it visible.</text><text x="600" y="475" text-anchor="middle" font-size="18" fill="#013B43">Reason · Responsible person · Next action · Check date</text><text x="60" y="560" font-size="20" fill="#013B43">Close only when the firm’s agreed completion criteria are met.</text><text x="60" y="596" font-size="15" fill="#013B43">Illustrative process. Stages, timing and approvals are defined for your practice.</text></g></svg>