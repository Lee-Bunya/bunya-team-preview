<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">AI meeting notes: conversation to follow-up</title><desc id="d">Prepare, draft, human review, approved record, assigned tasks.</desc><rect width="1200" height="630" fill="#F2F8F8"/><text x="60" y="76" fill="#0A7D79" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">BUNYA INSIGHTS / AI &amp; ADVICE</text><text x="60" y="147" fill="#040F1D" font-family="Arial,sans-serif" font-size="43" font-weight="bold">The meeting ends. The workflow continues.</text><path d="M160 330H1040" stroke="#0A7D79" stroke-width="3"/><g transform="translate(60 235)"><rect width="200" height="228" rx="8" fill="white" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#0A7D79">01</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#013B43">PREPARE</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="#040F1D">Agree capture<tspan x="22" dy="29">and access</tspan></text></g><g transform="translate(280 235)"><rect width="200" height="228" rx="8" fill="white" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#0A7D79">02</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#013B43">DRAFT</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="#040F1D">Organise notes<tspan x="22" dy="29">and questions</tspan></text></g><g transform="translate(500 235)"><rect width="200" height="228" rx="8" fill="#013B43" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#11B8B1">03</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="white">REVIEW</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="white">Check facts<tspan x="22" dy="29">and decisions</tspan></text></g><g transform="translate(720 235)"><rect width="200" height="228" rx="8" fill="white" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#0A7D79">04</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#013B43">FILE</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="#040F1D">Save the<tspan x="22" dy="29">approved record</tspan></text></g><g transform="translate(940 235)"><rect width="200" height="228" rx="8" fill="white" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#0A7D79">05</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#013B43">FOLLOW UP</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="#040F1D">Assign owners<tspan x="22" dy="29">and due dates</tspan></text></g><text x="60" y="548" fill="#013B43" font-family="Arial,sans-serif" font-size="22">Human review connects an AI draft to a record the team can use.</text></svg>