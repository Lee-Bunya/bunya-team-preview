<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#F2F8F8"/><g font-family="Arial,sans-serif"><text x="60" y="65" fill="#0A7D79" font-size="17" letter-spacing="3">BUNYA INSIGHTS / REVIEWABLE RECORDS</text><text x="60" y="126" fill="#040F1D" font-size="40" font-weight="700">Make the trail easy to follow.</text><rect x="60" y="205" width="340" height="200" rx="5" fill="white" stroke="#D9E6E6"/><text x="84" y="247" fill="#0A7D79" font-size="16">CONTEXT</text><text x="84" y="300" fill="#040F1D" font-size="27" font-weight="700">What was intended?</text><text x="84" y="354" fill="#013B43" font-size="21">Client · Matter · Scope</text><path d="M404 305h23m-7-7 7 7-7 7" stroke="#0A7D79" stroke-width="2" fill="none"/><rect x="430" y="205" width="340" height="200" rx="5" fill="white" stroke="#D9E6E6"/><text x="454" y="247" fill="#0A7D79" font-size="16">ACTIVITY</text><text x="454" y="300" fill="#040F1D" font-size="27" font-weight="700">What happened?</text><text x="454" y="354" fill="#013B43" font-size="21">Dates · People · Sources</text><path d="M774 305h23m-7-7 7 7-7 7" stroke="#0A7D79" stroke-width="2" fill="none"/><rect x="800" y="205" width="340" height="200" rx="5" fill="#013B43" stroke="#D9E6E6"/><text x="824" y="247" fill="white" font-size="16">REVIEW</text><text x="824" y="300" fill="white" font-size="27" font-weight="700">What was checked?</text><text x="824" y="354" fill="white" font-size="21">Version · Decision · Owner</text><rect x="60" y="449" width="1080" height="76" rx="4" fill="#D9E6E6"/><text x="600" y="495" text-anchor="middle" fill="#013B43" font-size="24">Across the trail: access · source links · exceptions · next actions</text><text x="60" y="589" fill="#013B43" font-size="16">An illustrative recordkeeping model. Reviewable records do not guarantee an audit outcome.</text></g></svg>