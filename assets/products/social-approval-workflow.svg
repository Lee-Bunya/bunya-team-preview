<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Social media: from idea to publication</title><desc id="d">Brief, draft, review, approve, publish and monitor.</desc><rect width="1200" height="630" fill="#F2F8F8"/><text x="60" y="76" fill="#0A7D79" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">BUNYA INSIGHTS / GOVERNANCE &amp; EVIDENCE</text><text x="60" y="147" fill="#040F1D" font-family="Arial,sans-serif" font-size="43" font-weight="bold">One idea. A clear route to publication.</text><path d="M160 330H1040" stroke="#0A7D79" stroke-width="3"/><g transform="translate(60 235)"><rect width="200" height="228" rx="8" fill="white" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#0A7D79">01</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#013B43">BRIEF</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="#040F1D">Set audience<tspan x="22" dy="29">and purpose</tspan></text></g><g transform="translate(280 235)"><rect width="200" height="228" rx="8" fill="white" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#0A7D79">02</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#013B43">DRAFT</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="#040F1D">Prepare copy<tspan x="22" dy="29">and creative</tspan></text></g><g transform="translate(500 235)"><rect width="200" height="228" rx="8" fill="#013B43" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#11B8B1">03</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="white">REVIEW</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="white">Check claims<tspan x="22" dy="29">and context</tspan></text></g><g transform="translate(720 235)"><rect width="200" height="228" rx="8" fill="white" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#0A7D79">04</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#013B43">APPROVE</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="#040F1D">Record the<tspan x="22" dy="29">version decision</tspan></text></g><g transform="translate(940 235)"><rect width="200" height="228" rx="8" fill="white" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#0A7D79">05</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#013B43">PUBLISH</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="#040F1D">Check live post<tspan x="22" dy="29">and responses</tspan></text></g><text x="60" y="548" fill="#013B43" font-family="Arial,sans-serif" font-size="22">Changed the message? Check whether it needs fresh approval.</text></svg>