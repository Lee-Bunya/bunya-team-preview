<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#F2F8F8"/><g font-family="Arial,sans-serif"><text x="60" y="62" font-size="17" letter-spacing="3" fill="#0A7D79">BUNYA INSIGHTS / SERVICE RECORDS</text><text x="60" y="123" font-size="39" font-weight="700" fill="#040F1D">Connect the promise to the record.</text><rect x="60" y="165" width="1080" height="94" rx="4" fill="white" stroke="#D9E6E6"/><text x="85" y="219" font-size="17" fill="#0A7D79">AGREEMENT</text><text x="290" y="218" font-size="27" font-weight="700" fill="#040F1D">What was agreed?</text><text x="630" y="218" font-size="21" fill="#013B43">Scope · Relevant period · Client</text><rect x="60" y="278" width="1080" height="94" rx="4" fill="white" stroke="#D9E6E6"/><text x="85" y="332" font-size="17" fill="#0A7D79">ACTIVITY</text><text x="290" y="331" font-size="27" font-weight="700" fill="#040F1D">What happened?</text><text x="630" y="331" font-size="21" fill="#013B43">Work record · Date · Responsible person</text><rect x="60" y="391" width="1080" height="94" rx="4" fill="#013B43" stroke="#D9E6E6"/><text x="85" y="445" font-size="17" fill="white">EVIDENCE</text><text x="290" y="444" font-size="27" font-weight="700" fill="white">What supports it?</text><text x="630" y="444" font-size="21" fill="white">Documents · Notes · Reviewed outputs</text><text x="60" y="540" fill="#013B43" font-size="21">Gaps stay visible: reason + owner + next action + review.</text><text x="60" y="587" fill="#013B43" font-size="16">An operational recordkeeping model, not a compliance test or guarantee.</text></g></svg>