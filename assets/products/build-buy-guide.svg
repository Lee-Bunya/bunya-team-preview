<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#F2F8F8"/><g font-family="Arial,sans-serif"><text x="60" y="62" fill="#0A7D79" font-size="17" letter-spacing="3">BUNYA INSIGHTS / BUILD OR BUY</text><text x="60" y="122" fill="#040F1D" font-size="39" font-weight="700">Compare the fit. Own the decision.</text><rect x="60" y="177" width="525" height="282" rx="5" fill="white" stroke="#D9E6E6"/><rect x="615" y="177" width="525" height="282" rx="5" fill="#013B43"/><text x="90" y="225" fill="#0A7D79" font-size="16">SUBSCRIPTION PRODUCT</text><text x="645" y="225" fill="white" font-size="16">TAILORED BUILD</text><text x="90" y="279" fill="#040F1D" font-size="29" font-weight="700">Test the product fit.</text><text x="645" y="279" fill="white" font-size="29" font-weight="700">Define the scope.</text><g font-size="22"><text x="90" y="326" fill="#013B43">Workflow coverage</text><text x="90" y="371" fill="#013B43">Configuration and integrations</text><text x="90" y="416" fill="#013B43">Licensing and service model</text><text x="645" y="326" fill="white">Requirements and acceptance</text><text x="645" y="371" fill="white">Delivery and platform dependencies</text><text x="645" y="416" fill="white">Maintenance and handover</text></g><path d="M320 470v30h560v-30" stroke="#0A7D79" stroke-width="2" fill="none"/><text x="600" y="544" text-anchor="middle" fill="#013B43" font-size="23" font-weight="700">Both: test real work, compare total cost, plan the exit.</text><text x="60" y="594" fill="#013B43" font-size="16">Neither model guarantees a better outcome. Evaluate the actual proposal.</text></g></svg>