<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Software rollout: from workflow to adoption</title><desc id="d">Define, pilot, train, launch, improve.</desc><rect width="1200" height="630" fill="#F2F8F8"/><text x="60" y="76" fill="#0A7D79" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">BUNYA INSIGHTS / PRACTICE OPERATIONS</text><text x="60" y="147" fill="#040F1D" font-family="Arial,sans-serif" font-size="43" font-weight="bold">Help the team put the system to work.</text><path d="M160 330H1040" stroke="#0A7D79" stroke-width="3"/><g transform="translate(60 235)"><rect width="200" height="228" rx="8" fill="white" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#0A7D79">01</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#013B43">DEFINE</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="#040F1D">Map work<tspan x="22" dy="29">and owners</tspan></text></g><g transform="translate(280 235)"><rect width="200" height="228" rx="8" fill="white" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#0A7D79">02</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#013B43">PILOT</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="#040F1D">Test realistic<tspan x="22" dy="29">scenarios</tspan></text></g><g transform="translate(500 235)"><rect width="200" height="228" rx="8" fill="#013B43" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#11B8B1">03</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="white">TRAIN</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="white">Practise tasks<tspan x="22" dy="29">by role</tspan></text></g><g transform="translate(720 235)"><rect width="200" height="228" rx="8" fill="white" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#0A7D79">04</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#013B43">LAUNCH</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="#040F1D">Confirm access<tspan x="22" dy="29">and support</tspan></text></g><g transform="translate(940 235)"><rect width="200" height="228" rx="8" fill="white" stroke="#D9E6E6"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="24" fill="#0A7D79">05</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#013B43">IMPROVE</text><text x="22" y="140" font-family="Arial,sans-serif" font-size="19" fill="#040F1D">Review issues<tspan x="22" dy="29">and outcomes</tspan></text></g><text x="60" y="548" fill="#013B43" font-family="Arial,sans-serif" font-size="22">Measure completed work and clear handovers, not just logins.</text></svg>