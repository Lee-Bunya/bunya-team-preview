<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#F2F8F8"/><g font-family="Arial,sans-serif"><text x="60" y="65" fill="#0A7D79" font-size="17" letter-spacing="3">BUNYA INSIGHTS / AI-ASSISTED ADVICE</text><text x="60" y="125" fill="#040F1D" font-size="40" font-weight="700">One instruction starts the work.</text><rect x="60" y="205" width="340" height="210" rx="5" fill="white" stroke="#D9E6E6"/><text x="82" y="250" font-size="16" fill="#0A7D79">INPUTS</text><text x="82" y="305" font-size="27" font-weight="700" fill="#040F1D">Confirm the context</text><text x="82" y="357" font-size="19" fill="#013B43">Records · Scope · Sources</text><path d="M405 310h20m-7-7 7 7-7 7" fill="none" stroke="#0A7D79" stroke-width="2"/><rect x="430" y="205" width="340" height="210" rx="5" fill="white" stroke="#D9E6E6"/><text x="452" y="250" font-size="16" fill="#0A7D79">AI PREPARATION</text><text x="452" y="305" font-size="27" font-weight="700" fill="#040F1D">Create the draft</text><text x="452" y="357" font-size="19" fill="#013B43">Defined task and template</text><path d="M775 310h20m-7-7 7 7-7 7" fill="none" stroke="#0A7D79" stroke-width="2"/><rect x="800" y="205" width="340" height="210" rx="5" fill="#013B43" stroke="#D9E6E6"/><text x="822" y="250" font-size="16" fill="white">HUMAN REVIEW</text><text x="822" y="305" font-size="27" font-weight="700" fill="white">Check and correct</text><text x="822" y="357" font-size="19" fill="white">Sources · Gaps · Decisions</text><path d="M970 430v55H600v-55" stroke="#0A7D79" stroke-width="2" fill="none"/><text x="600" y="532" text-anchor="middle" fill="#013B43" font-size="23">Resolve gaps and revise before the authorised next step.</text><text x="60" y="593" fill="#013B43" font-size="16">Illustrative workflow. A generated draft is not approval or evidence of compliance.</text></g></svg>